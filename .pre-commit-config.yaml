# Estándares de codificación segura — ejecuta estos hooks antes de cada commit.
#
# Instalación:
#   pip install pre-commit
#   pre-commit install
#
# Cada hook bloquea el commit si detecta problemas (secretos, estilo, etc.).

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: ["check", "--fix"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
